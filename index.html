<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOB Compilatore Policy - Browser Version</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html,
        body {
            height: 100%;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .main-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 2rem;
            max-width: 1400px;
            width: 95%;
        }

        .template-list {
            max-height: 400px;
            overflow-y: auto;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 1rem;
        }

        .card {
            border: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 15px;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 0.75rem 2rem;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 15px rgba(102, 126, 234, 0.4);
        }

        .form-check-input:checked {
            background-color: #667eea;
            border-color: #667eea;
        }

        h1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
        }

        .template-upload-zone {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 1.5rem;
        }

        .template-upload-zone:hover {
            background-color: #f8f9fa;
            border-color: #764ba2;
        }

        .result-card {
            margin-top: 2rem;
            padding: 1.5rem;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
        }

        .compiled-output {
            background: white;
            border-radius: 10px;
            padding: 1.5rem;
            margin-top: 1rem;
            max-height: 400px;
            overflow-y: auto;
        }

        .badge-template {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="main-container">
        <h1 class="mb-4 text-center">📝 BOB Compilatore Policy</h1>
        <p class="text-center text-muted mb-4">Versione Browser - Nessun server richiesto!</p>

        <!-- Template Upload Section -->
        <div class="template-upload-zone" id="uploadZone">
            <h5>📂 Carica i tuoi template</h5>
            <p class="text-muted mb-3">Trascina qui i file .html o .md oppure clicca per selezionarli</p>
            <input type="file" id="templateFiles" multiple accept=".html,.md" style="display: none;">
            <button class="btn btn-outline-primary" onclick="document.getElementById('templateFiles').click()">
                Seleziona File
            </button>
        </div>

        <div class="row">
            <!-- Template Selection Column -->
            <div class="col-md-5">
                <div class="card h-100">
                    <div class="card-header bg-gradient text-white"
                        style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                        <strong>1. Scegli i template</strong>
                    </div>
                    <div class="card-body template-list" id="templateList">
                        <p class="text-muted text-center">Nessun template caricato. Carica i file sopra.</p>
                    </div>
                </div>
            </div>

            <!-- Dynamic Fields Column -->
            <div class="col-md-7">
                <div class="card h-100">
                    <div class="card-header bg-gradient text-white"
                        style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                        <strong>2. Compila i campi</strong>
                    </div>
                    <div class="card-body" id="dynamicFieldsContainer" style="display:none;">
                        <!-- Export Format Selector -->
                        <div class="mb-4 p-3 bg-light rounded">
                            <label class="form-label fw-bold mb-3">📄 Formato di esportazione:</label>
                            <div class="d-flex gap-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="exportFormat" id="formatHTML"
                                        value="html" checked>
                                    <label class="form-check-label" for="formatHTML">
                                        <strong>HTML</strong> - Documento web completo
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="exportFormat" id="formatMD"
                                        value="md">
                                    <label class="form-check-label" for="formatMD">
                                        <strong>Markdown</strong> - Testo formattato
                                    </label>
                                </div>
                            </div>
                        </div>
                        <hr>
                        <div id="dynamicFields" class="row"></div>
                    </div>
                    <div class="card-footer" id="compileBtnContainer" style="display:none;">
                        <button type="button" class="btn btn-primary w-100" onclick="compileTemplates()">
                            ✨ Compila Selezionati
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Results Section -->
        <div id="resultsSection" style="display: none;">
            <div class="result-card">
                <h3 class="text-center mb-4">✅ Compilazione Completata!</h3>
                <div id="compiledDocuments"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
